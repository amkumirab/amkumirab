name: Refresh profile visuals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - scripts/**
      - assets/profile-source.jpg
      - README.md
      - .github/workflows/update-profile.yml
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generate profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python -m pip install -r scripts/requirements.txt
          python scripts/generate.py
      - name: Check generated SVG files
        run: |
          python -m compileall -q scripts
          python -c "from pathlib import Path; from xml.etree import ElementTree as ET; [ET.parse(path) for path in Path('assets').glob('*.svg')]"
      - name: Commit refreshed assets
        run: |
          if git diff --quiet -- assets; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile stats"
          git push
